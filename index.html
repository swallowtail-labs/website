<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swallowtail</title>
<meta name="description" content="Software-hardware co-design that makes 3D chips possible.">
<link rel="icon" href="swallowtail-mark.svg" type="image/svg+xml">
<meta property="og:title" content="Swallowtail">
<meta property="og:description" content="Software-hardware co-design that makes 3D chips possible.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://swallowtaillabs.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  .brand {
    position: fixed; z-index: 3; top: clamp(14px, 2.4vw, 28px); left: clamp(16px, 3vw, 40px);
    display: inline-flex; align-items: center; gap: 0.6rem; text-decoration: none;
    color: rgba(255, 255, 255, 0.82); font: 500 11px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.26em;
    mix-blend-mode: difference;
  }
  .brand img { width: 20px; height: auto; filter: brightness(0) invert(1); }
  .hint {
    position: fixed; z-index: 3; right: clamp(16px, 3vw, 40px); bottom: clamp(12px, 2vw, 24px); margin: 0;
    font: 400 10px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(255, 255, 255, 0.35); mix-blend-mode: difference;
  }
  .copy { right: auto; left: clamp(16px, 3vw, 40px); }
  .grain { position: fixed; inset: -50%; z-index: 2; pointer-events: none; opacity: 0.09; animation: grain 0.5s steps(5) infinite; background-size: 256px 256px; }
  @keyframes grain { 0% { transform: translate(0, 0); } 20% { transform: translate(-7%, 4%); } 40% { transform: translate(5%, -6%); } 60% { transform: translate(-3%, 8%); } 80% { transform: translate(8%, 2%); } 100% { transform: translate(0, 0); } }
  .vign { position: fixed; inset: 0; z-index: 2; pointer-events: none; background: radial-gradient(ellipse at center, transparent 58%, rgba(0, 0, 0, 0.55)); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  noscript p { position: fixed; inset: 0; display: grid; place-items: center; margin: 0; color: #fff; font: 400 28px/1.3 "STIX Two Text", serif; text-align: center; padding: 24px; }
  @media (max-width: 600px) { #hint { display: none; } }
  @media (prefers-reduced-motion: reduce) { .grain { animation: none; } }
</style>
</head>
<body>
<a class="brand" href="/"><img src="swallowtail-mark.svg" alt="" width="20" height="20">SWALLOWTAIL</a>
<h1 class="sr-only">Swallowtail: software-hardware co-design that makes 3D chips possible.</h1>
<canvas id="c" aria-label="Animation: 2D chips, 3D stacking, trapped heat, and inverse design moving hot blocks until the peak temperature falls." role="img"></canvas>
<div class="grain" id="grain"></div>
<div class="vign"></div>
<p class="hint copy">&copy; 2026 Swallowtail Labs, Inc.</p>
<p class="hint" id="hint">Click for sound &middot; P pause &middot; F full screen</p>
<noscript><p>Swallowtail. Software-hardware co-design that makes 3D chips possible.</p></noscript>
<script>
(() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), im = g.createImageData(256, 256);
  for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0);
  document.getElementById('grain').style.backgroundImage = 'url(' + c.toDataURL() + ')';
})();
</script>
<script src="thermal.js"></script>
<script src="sound.js"></script>
<script src="edit.js"></script>
</body>
</html>
